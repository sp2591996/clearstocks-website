# .github/workflows/refresh-weekly.yml
#
# Runs once a week and refreshes the numbers behind the site that
# aren't the live intraday price (that's refresh-prices.yml):
#   - each stock's own reported financial history (revenue, profit,
#     debt, cash flow, ROE, ...) -> fundamentals_history/*.csv,
#     fundamentals_all.json
#   - company_facts.json (name/industry/ISIN lookup)
#   - dashboard_data.json: ROE refreshed for all 200 stocks, and
#     PE/PB/market cap/52-week range refreshed for the 10 stocks
#     that have actually been researched (the other 190 stay marked
#     "Not yet scored" on purpose, until they get properly researched)
#
# This does NOT touch curated research text (verdicts, summaries) and
# does NOT regenerate the PDF decks — those are separate, manual steps.
#
# Unlike the 15-minute price refresh, this one is NOT auto-pushed: it
# opens a Pull Request instead, so you can glance over the diff and
# hit Merge yourself. A wrong price self-corrects in 15 minutes; a bad
# fundamentals fetch is worth a second look first.

name: Weekly data refresh

on:
  schedule:
    # Every Monday, 02:00 UTC (~7:30am IST) — before the trading day starts.
    - cron: '0 2 * * 1'
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run weekly data refresh
        run: python refresh_weekly_data.py

      - name: Open a Pull Request with the refreshed data (if anything changed)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly data refresh [automated]"
          title: "Weekly data refresh"
          body: |
            Automated weekly refresh of fundamentals, ROE, and (for the
            10 researched stocks) valuation ratios. No curated research
            text or PDF decks were touched.

            Review the diff, then click **Merge pull request** to publish
            it to the live site — or close this PR to skip this week's
            refresh.
          branch: weekly-data-refresh
          delete-branch: true
          add-paths: |
            fundamentals_history/**
            fundamentals_all.json
            company_facts.json
            dashboard_data.json
            status.json

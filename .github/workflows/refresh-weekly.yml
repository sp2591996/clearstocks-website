# .github/workflows/refresh-weekly.yml
#
# Runs once a DAY and refreshes the numbers behind the site that
# aren't the live intraday price (that's refresh-prices.yml):
#   - each stock's own reported financial history (revenue, profit,
#     debt, cash flow, ROE, ...) -> fundamentals_history/*.csv,
#     fundamentals_all.json
#   - company_facts.json (name/industry/ISIN lookup)
#   - dashboard_data.json: ROE AND PE/PB/market cap/52-week range
#     refreshed for ALL 200 stocks, whether or not that stock has a
#     research deck yet -- deck status and refresh status are two
#     separate things now.
#
# This does NOT touch curated research text (verdicts, summaries) and
# does NOT regenerate the PDF decks -- those are separate, manual steps
# (a deck is simply built using whatever numbers are here at the time).
#
# Unlike the 15-minute price refresh, this one is NOT auto-pushed: it
# opens a Pull Request instead, so you can glance over the diff and
# hit Merge yourself. A wrong price self-corrects in 15 minutes; a bad
# fundamentals fetch is worth a second look first.
#
# If any stock's fetch fails, it no longer disappears into the log
# unnoticed: status.json records last_refresh_market_failed_symbols
# so it's visible on the site's own "Refresh now" panel.

name: Weekly data refresh

on:
  schedule:
    # Every day, 02:00 UTC (~7:30am IST) — before the trading day starts.
    - cron: '0 2 * * *'
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run daily data refresh
        run: python refresh_weekly_data.py

      - name: Compute automated valuation verdicts and scores for all 200 stocks
        run: python compute_auto_scores.py

      - name: Open a Pull Request with the refreshed data (if anything changed)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Daily data refresh [automated]"
          title: "Daily data refresh"
          body: |
            Automated daily refresh of fundamentals, ROE, and valuation
            ratios (PE, PB, market cap, 52-week range) for all 200
            stocks. No curated research text or PDF decks were touched.

            If any stocks failed to refresh, they're listed in
            status.json under last_refresh_market_failed_symbols -- check
            there if a stock's numbers look stale after merging.

            Review the diff, then click **Merge pull request** to publish
            it to the live site — or close this PR to skip this refresh.
          branch: weekly-data-refresh
          delete-branch: true
          add-paths: |
            fundamentals_history/**
            fundamentals_all.json
            company_facts.json
            dashboard_data.json
            status.json